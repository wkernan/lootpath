<!--
  The Waymark at 16, EDGE layer (UX-4d, WKE-613; first drawn for UX-4c).

  The same two chevrons as `mark16-fill.svg`, filled AND stroked in white so
  what comes out is one solid SILHOUETTE, dilated by half the stroke on every
  side. Drawn under the fill at the same anchor and tinted near-black, that
  dilation is the keyline: a one-unit dark outline around every edge of both
  chevrons, which is what the pre-UX-4c mark lacked - it had an offset shadow
  layer instead, and an offset is a shadow on one side, not an outline.

  Stroke width and `stroke-linejoin: round` are the sign-off page's own (section
  3b, round two: a one-unit keyline on bands a unit thicker), so the chevron tips
  are rounded here exactly as they are in the drawing.

  Both chevrons are opaque here AND in the fill since UX-4d: the owner asked for
  the two chevrons in one colour, so there is no longer a 65% body to argue
  about. Under UX-4c this file's note recorded why the 65% never belonged on the
  keyline; that question is now moot.

  The lower chevron's bottom edge sits at y=16 on a 16-unit canvas, so half of
  its 1-unit stroke reaches y=16.5 and the last half unit is clipped by the
  canvas - the same trade UX-4c recorded (it clipped 0.05 of a unit), and the
  drawing's own geometry, kept rather than nudged. The upper chevron's arms end
  at x=0.5 and x=15.5, so their strokes reach the left and right edges exactly.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round">
    <path d="M8 8 L13.5 13.5 L13.5 16 L8 10.5 L2.5 16 L2.5 13.5 Z"/>
    <path d="M8 1 L15.5 8.5 L15.5 12.5 L8 5 L0.5 12.5 L0.5 8.5 Z"/>
  </g>
</svg>
